name: Check PNG encoder compatibility
on:
  workflow_dispatch:
    inputs:
      diagnostic_run:
        description: Run containing an unexpired png-compat artifact
        required: true
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Restore small diagnostic sample
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIAGNOSTIC_RUN: ${{ inputs.diagnostic_run }}
        run: gh run download "$DIAGNOSTIC_RUN" --pattern 'png-compat-*' --dir sample
      - name: Test official Pillow wheel
        continue-on-error: true
        run: |
          python -m pip install --only-binary=:all: pillow==12.1.1
          python scripts/png_probe.py sample
      - name: Build the matching zlib-ng compatibility library
        run: |
          bash scripts/png_backend.sh
          LD_PRELOAD="$PWD/.tools/png-zlib-ng-2.3.2/lib/libz.so.1" python scripts/png_probe.py sample
